# ============================================================
# Google Cloud Build — customerSAX Microservices Orchestrator
# ============================================================
#
# Triggered by GitHub Actions via `gcloud builds submit`.
# $PROJECT_ID, $BRANCH_NAME, $COMMIT_SHA are Cloud Build built-in
# substitutions — injected automatically.
#
# Pipeline (4 sequential steps):
#   1. detect        — git diff → writes /workspace/services_to_deploy.txt
#   2. build-and-push— docker build + push per service (4 parallel)
#   3. deploy        — gcloud run deploy per service (with per-service tuning)
#   4. update-urls   — inject all Cloud Run URLs into services
#
# /workspace is shared across all steps.
# /root/.docker is shared (docker auth from Step 1 → Step 2).
#
# Rules:
#   • NEVER uses --set-env-vars or --set-secrets (always --update-*)
#   • All secrets come from GCP Secret Manager (created by Terraform)
#   • studio, marketing excluded (Vercel/frontend — not built here)
# ============================================================

steps:
  # ────────────────────────────────────────────────────────────
  # Step 1: Detect changed services + configure Docker auth.
  # Writes /workspace/services_to_deploy.txt and
  # /workspace/build_config.sh for downstream steps.
  # ────────────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'detect'
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BRANCH_NAME=$BRANCH_NAME'
      - 'COMMIT_SHA=$COMMIT_SHA'
    args:
      - 'scripts/cloudbuild-detect.sh'
    timeout: 120s

  # ────────────────────────────────────────────────────────────
  # Step 2: Build Docker images and push to Artifact Registry.
  # Uses gcr.io/cloud-builders/docker (has docker CLI).
  # Docker credentials from Step 1 shared via /root/.docker volume.
  # ────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-and-push'
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'COMMIT_SHA=$COMMIT_SHA'
    args:
      - 'scripts/cloudbuild-build-push.sh'
    waitFor:
      - 'detect'
    timeout: 3600s

  # ────────────────────────────────────────────────────────────
  # Step 3: Deploy each built image to Cloud Run.
  # Applies per-service resource config, secrets, and IAM.
  # ────────────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'COMMIT_SHA=$COMMIT_SHA'
    args:
      - 'scripts/cloudbuild-deploy.sh'
    waitFor:
      - 'build-and-push'
    timeout: 1800s

  # ────────────────────────────────────────────────────────────
  # Step 4: Collect all Cloud Run URLs and inject into services.
  # ────────────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-service-urls'
    entrypoint: bash
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BRANCH_NAME=$BRANCH_NAME'
      - 'COMMIT_SHA=$COMMIT_SHA'
    args:
      - 'scripts/cloudbuild-update-urls.sh'
    waitFor:
      - 'deploy'
    timeout: 600s

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Overall pipeline timeout (6 services × ~5 min build + deploy + headroom)
timeout: 3600s

tags:
  - 'customersax'
  - 'cloud-run'
  - 'orchestrator'
