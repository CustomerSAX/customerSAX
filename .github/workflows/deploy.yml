name: Deploy customerSAX

on:
  push:
    branches:
      - customerSAX-Prod

env:
  PROJECT_ID: customerservice-505511
  PROJECT_NUMBER: "17754871169"
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  PLACEHOLDER_IMAGE: us-docker.pkg.dev/cloudrun/container/hello

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Bootstrap — ensure ALL Cloud Run services exist before Terraform.
  # Creates any missing services via gcloud (idempotent). This prevents the
  # "chicken-and-egg" where Terraform references a service URI before it exists.
  # ──────────────────────────────────────────────────────────────────────────
  bootstrap-services:
    name: "🌱 Bootstrap Cloud Run Services"
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Create missing Cloud Run services (idempotent)
        run: |
          if [ "${{ github.ref_name }}" = "customerSAX-Prod" ]; then
            PREFIX="csa-production"
          elif [ "${{ github.ref_name }}" = "customerSAX-QA" ]; then
            PREFIX="csa-qa"
          else
            PREFIX="csa-dev"
          fi

          # First ensure all APIs are enabled
          gcloud services enable run.googleapis.com \
            secretmanager.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            --project="${{ env.PROJECT_ID }}" --quiet

          # Public entry-point services. Access is managed manually in Cloud Run
          # because the deploy identities cannot mutate service IAM in this project.
          PUBLIC_SERVICES=(
            "${PREFIX}-bff"
            "${PREFIX}-auth"
          )

          # Private services (service-to-service auth only)
          PRIVATE_SERVICES=(
            "${PREFIX}-ai-assist"
            "${PREFIX}-commerce-commercetools"
            "${PREFIX}-ticketing"
            "${PREFIX}-admin"
            "${PREFIX}-commerce-shopify"
            "${PREFIX}-commerce-bigcommerce"
            "${PREFIX}-commerce-sfcc"
          )

          for SVC in "${PUBLIC_SERVICES[@]}"; do
            EXISTS=$(gcloud run services describe "${SVC}" \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --format='value(name)' 2>/dev/null || echo "")
            if [ -z "${EXISTS}" ]; then
              echo "🌱 Creating public placeholder: ${SVC}"
              gcloud run deploy "${SVC}" \
                --image="${{ env.PLACEHOLDER_IMAGE }}" \
                --region="${{ env.REGION }}" \
                --project="${{ env.PROJECT_ID }}" \
                --quiet
            else
              echo "  ✓ ${SVC} exists"
            fi
          done

          for SVC in "${PRIVATE_SERVICES[@]}"; do
            EXISTS=$(gcloud run services describe "${SVC}" \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" \
              --format='value(name)' 2>/dev/null || echo "")
            if [ -z "${EXISTS}" ]; then
              echo "🌱 Creating private placeholder: ${SVC}"
              gcloud run deploy "${SVC}" \
                --image="${{ env.PLACEHOLDER_IMAGE }}" \
                --region="${{ env.REGION }}" \
                --project="${{ env.PROJECT_ID }}" \
                --quiet
              echo "  ✅ ${SVC} created"
            else
              echo "  ✓ ${SVC} already exists"
            fi
          done

          echo ""
          echo "✅ All Cloud Run services exist — bff + auth are PUBLIC, others are private"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Terraform — provision infra with all services guaranteed to exist
  # ──────────────────────────────────────────────────────────────────────────
  terraform-apply:
    name: "🏗️ Provision Infrastructure"
    runs-on: ubuntu-latest
    needs: bootstrap-services
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        run: |
          if [ "${{ github.ref_name }}" = "customerSAX-Prod" ]; then
            ENV_VAR="production"
          elif [ "${{ github.ref_name }}" = "customerSAX-QA" ]; then
            ENV_VAR="qa"
          else
            ENV_VAR="dev"
          fi

          cd infra/gcp
          terraform init

          terraform_import() {
            local address="$1"
            local id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "✓ Terraform already tracks ${address}"
              return 0
            fi

            terraform import \
              -var="project_id=${{ env.PROJECT_ID }}" \
              -var="project_number=${{ env.PROJECT_NUMBER }}" \
              -var="region=${{ env.REGION }}" \
              -var="environment=${ENV_VAR}" \
              "$address" "$id"
          }

          import_secret_if_exists() {
            local address="$1"
            local id="$2"
            local name="$3"

            if gcloud secrets describe "$name" \
              --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              echo "Importing existing Secret Manager secret: ${name}"
              terraform_import "$address" "$id"
            fi
          }

          import_cloud_run_if_exists() {
            local address="$1"
            local id="$2"
            local name="$3"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "✓ Terraform already tracks ${address}"
              return 0
            fi

            if gcloud run services describe "$name" \
              --region="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              echo "Importing existing Cloud Run service: ${name}"
              terraform_import "$address" "$id"
            fi
          }

          import_artifact_repo_if_exists() {
            local address="$1"
            local id="$2"
            local name="$3"

            if gcloud artifacts repositories describe "$name" \
              --location="${{ env.REGION }}" \
              --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              echo "Importing existing Artifact Registry repository: ${name}"
              terraform_import "$address" "$id"
            fi
          }

          import_bigquery_dataset_if_exists() {
            local address="$1"
            local id="$2"
            local name="$3"

            if bq --project_id="${{ env.PROJECT_ID }}" show "${{ env.PROJECT_ID }}:${name}" >/dev/null 2>&1; then
              echo "Importing existing BigQuery dataset: ${name}"
              terraform_import "$address" "$id"
            fi
          }

          PREFIX="csa-${ENV_VAR}"

          import_artifact_repo_if_exists 'google_artifact_registry_repository.repo' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/repositories/${PREFIX}-repo" \
            "${PREFIX}-repo"

          import_bigquery_dataset_if_exists 'google_bigquery_dataset.analytics' \
            "projects/${{ env.PROJECT_ID }}/datasets/csa_${ENV_VAR}_analytics" \
            "csa_${ENV_VAR}_analytics"

          import_secret_if_exists 'google_secret_manager_secret.llm["ai_gateway_api_key"]' \
            "projects/${{ env.PROJECT_ID }}/secrets/${PREFIX}-ai-gateway-api-key" \
            "${PREFIX}-ai-gateway-api-key"

          import_secret_if_exists 'google_secret_manager_secret.commerce["commercetools_client_id"]' \
            "projects/${{ env.PROJECT_ID }}/secrets/${PREFIX}-commercetools-client-id" \
            "${PREFIX}-commercetools-client-id"

          import_secret_if_exists 'google_secret_manager_secret.commerce["commercetools_client_secret"]' \
            "projects/${{ env.PROJECT_ID }}/secrets/${PREFIX}-commercetools-client-secret" \
            "${PREFIX}-commercetools-client-secret"

          import_secret_if_exists 'google_secret_manager_secret.ticketing["ticketing_mongo_uri"]' \
            "projects/${{ env.PROJECT_ID }}/secrets/${PREFIX}-ticketing-mongo-uri" \
            "${PREFIX}-ticketing-mongo-uri"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.bff' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-bff" \
            "${PREFIX}-bff"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.auth' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-auth" \
            "${PREFIX}-auth"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.ai_assist' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-ai-assist" \
            "${PREFIX}-ai-assist"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.commerce_commercetools' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-commerce-commercetools" \
            "${PREFIX}-commerce-commercetools"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.commerce_shopify' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-commerce-shopify" \
            "${PREFIX}-commerce-shopify"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.commerce_bigcommerce' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-commerce-bigcommerce" \
            "${PREFIX}-commerce-bigcommerce"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.commerce_sfcc' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-commerce-sfcc" \
            "${PREFIX}-commerce-sfcc"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.admin' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-admin" \
            "${PREFIX}-admin"

          import_cloud_run_if_exists 'google_cloud_run_v2_service.ticketing' \
            "projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/services/${PREFIX}-ticketing" \
            "${PREFIX}-ticketing"

          terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="region=${{ env.REGION }}" \
            -var="environment=${ENV_VAR}"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Build + Deploy all changed services via Cloud Build
  # ──────────────────────────────────────────────────────────────────────────
  cloud-build-deploy:
    name: "🚀 Build & Deploy via Cloud Build"
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Submit Cloud Build Pipeline
        run: |
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --substitutions="BRANCH_NAME=${{ github.ref_name }},COMMIT_SHA=${{ github.sha }}"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy frontend apps to Vercel (runs in parallel with Cloud Build)
  # Uses pre-configured secrets: VERCEL_TOKEN, VERCEL_ORG_ID,
  # VERCEL_PROJECT_ID_STUDIO, VERCEL_PROJECT_ID_MARKETING, VERCEL_PROJECT_ID_DOCS
  # ──────────────────────────────────────────────────────────────────────────
  vercel-deploy:
    name: "🌐 Deploy Frontend to Vercel"
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install dependencies (monorepo root)
        run: pnpm install --frozen-lockfile

      - name: Deploy studio to Vercel
        run: |
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "⚠️ VERCEL_PROJECT_ID_STUDIO is empty. Skipping Studio deployment."
            exit 0
          fi
          echo "Deploying Studio with VERCEL_PROJECT_ID_STUDIO. If Vercel reports 'Project not found', update VERCEL_ORG_ID, VERCEL_PROJECT_ID_STUDIO, and VERCEL_TOKEN to values from the active Vercel team."
          
          if [ "${{ github.ref_name }}" = "customerSAX-Prod" ]; then
            PROD_FLAG="--prod"
            PREFIX="csa-production"
            STUDIO_URL="${{ vars.STUDIO_URL_PROD || 'https://studio.customersax.com' }}"
          elif [ "${{ github.ref_name }}" = "customerSAX-QA" ]; then
            PROD_FLAG=""
            PREFIX="csa-qa"
            STUDIO_URL="${{ vars.STUDIO_URL_QA || 'https://qa-studio.customersax.com' }}"
          else
            PROD_FLAG=""
            PREFIX="csa-dev"
            STUDIO_URL="${{ vars.STUDIO_URL_DEV || 'https://studio.customersax.com' }}"
          fi
          
          RUN_HOST_SUFFIX="v3egj3ywmq-uc.a.run.app"
          BFF_URL="https://${PREFIX}-bff-${RUN_HOST_SUFFIX}/graphql"
          AUTH_URL="https://${PREFIX}-auth-${RUN_HOST_SUFFIX}"
          AI_ASSIST_URL="https://${PREFIX}-ai-assist-${RUN_HOST_SUFFIX}"
          
          vercel deploy $PROD_FLAG \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --build-env NEXT_PUBLIC_GRAPHQL_URL="/api/graphql" \
            --build-env AI_COMMERCE_SERVICE_URL="$BFF_URL" \
            --build-env AUTH_SERVICE_URL="$AUTH_URL" \
            --build-env AI_ASSIST_URL="$AI_ASSIST_URL" \
            --build-env AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
            --build-env AUTH0_ISSUER_BASE_URL="https://${{ secrets.AUTH0_DOMAIN }}" \
            --build-env AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
            --build-env AUTH0_CLIENT_SECRET="${{ secrets.AUTH0_CLIENT_SECRET }}" \
            --build-env AUTH0_SECRET="${{ secrets.AUTH0_SECRET }}" \
            --build-env APP_BASE_URL="$STUDIO_URL" \
            --build-env AUTH0_BASE_URL="$STUDIO_URL" \
            --build-env SEED_SECRET="${{ secrets.SEED_SECRET }}" \
            --env NEXT_PUBLIC_GRAPHQL_URL="/api/graphql" \
            --env AI_COMMERCE_SERVICE_URL="$BFF_URL" \
            --env AUTH_SERVICE_URL="$AUTH_URL" \
            --env AI_ASSIST_URL="$AI_ASSIST_URL" \
            --env AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
            --env AUTH0_ISSUER_BASE_URL="https://${{ secrets.AUTH0_DOMAIN }}" \
            --env AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
            --env AUTH0_CLIENT_SECRET="${{ secrets.AUTH0_CLIENT_SECRET }}" \
            --env AUTH0_SECRET="${{ secrets.AUTH0_SECRET }}" \
            --env APP_BASE_URL="$STUDIO_URL" \
            --env AUTH0_BASE_URL="$STUDIO_URL" \
            --env SEED_SECRET="${{ secrets.SEED_SECRET }}" \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STUDIO }}

      - name: Deploy marketing to Vercel
        run: |
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "⚠️ VERCEL_PROJECT_ID_MARKETING is empty. Skipping Marketing deployment."
            exit 0
          fi
          
          if [ "${{ github.ref_name }}" = "customerSAX-Prod" ]; then
            PROD_FLAG="--prod"
          else
            PROD_FLAG=""
          fi
          
          vercel deploy $PROD_FLAG \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MARKETING }}

      - name: Deploy docs-site to Vercel
        run: |
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "⚠️ VERCEL_PROJECT_ID_DOCS is empty. Skipping Docs Site deployment."
            exit 0
          fi
          
          if [ "${{ github.ref_name }}" = "customerSAX-Prod" ]; then
            PROD_FLAG="--prod"
          else
            PROD_FLAG=""
          fi
          
          vercel deploy $PROD_FLAG \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Print service URLs after successful deployment
  # ──────────────────────────────────────────────────────────────────────────
  deployment-summary:
    name: "📋 Deployment Summary"
    runs-on: ubuntu-latest
    needs: [cloud-build-deploy, vercel-deploy]
    if: always() && needs.cloud-build-deploy.result == 'success'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Print deployed service URLs
        run: |
          echo "🎉 customerSAX Deployment Complete"
          echo ""
          echo "── GCP Cloud Run ────────────────────────"
          for SVC in bff auth ai-assist commerce-commercetools ticketing admin; do
            RUN_SVC="csa-dev-${SVC}"
            URL=$(gcloud run services describe "${RUN_SVC}" \
              --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" \
              --format='value(status.url)' 2>/dev/null || echo "not deployed")
            echo "  ${SVC}: ${URL}"
          done
          echo ""
          echo "── Vercel Frontend ──────────────────────"
          echo "  studio:    https://customersax.vercel.app"
          echo "  docs-site: https://docs.customersax.com"
          echo "  marketing: (check Vercel dashboard)"
