name: Deploy customerSAX

on:
  push:
    branches:
      - customerSAX-Prod

env:
  PROJECT_ID: customerservice-505511
  PROJECT_NUMBER: "17754871169"
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  ARTIFACT_REPO: csa-dev-repo

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Provision GCP infrastructure via Terraform
  # Creates/updates Cloud Run services, Secret Manager, Artifact Registry, etc.
  # ──────────────────────────────────────────────────────────────────────────
  terraform-apply:
    name: "🏗️ Provision Infrastructure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        run: |
          cd infra/gcp
          terraform init
          terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="region=${{ env.REGION }}" \
            -var="environment=dev"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build + Deploy all changed services via Cloud Build
  #
  # Delegates to the 4-step Cloud Build pipeline (cloudbuild.yaml):
  #   Step 1: cloudbuild-detect.sh      detect changed services via git diff
  #   Step 2: cloudbuild-build-push.sh  docker build + push (4 parallel)
  #   Step 3: cloudbuild-deploy.sh      gcloud run deploy with per-service tuning
  #   Step 4: cloudbuild-update-urls.sh wire service URLs between services
  #
  # Cloud Build runs on E2_HIGHCPU_8 (8 vCPU / 8 GB RAM) — faster than
  # GitHub Actions runners for Docker builds.
  # ──────────────────────────────────────────────────────────────────────────
  cloud-build-deploy:
    name: "🚀 Build & Deploy via Cloud Build"
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Submit Cloud Build Pipeline
        run: |
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --substitutions="BRANCH_NAME=${{ github.ref_name }},COMMIT_SHA=${{ github.sha }}"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Print service URLs after successful deployment
  # ──────────────────────────────────────────────────────────────────────────
  deployment-summary:
    name: "📋 Deployment Summary"
    runs-on: ubuntu-latest
    needs: cloud-build-deploy
    if: always() && needs.cloud-build-deploy.result == 'success'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Print deployed service URLs
        run: |
          echo "🎉 customerSAX Deployment Complete"
          echo ""
          for SVC in bff auth ai-assist commerce-commercetools ticketing admin; do
            RUN_SVC="csa-dev-${SVC}"
            URL=$(gcloud run services describe "${RUN_SVC}" \
              --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" \
              --format='value(status.url)' 2>/dev/null || echo "not deployed")
            echo "  ${SVC}: ${URL}"
          done
