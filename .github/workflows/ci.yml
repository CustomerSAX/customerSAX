name: CI

# Real PR/branch validation. Replaces the effectively-dead bitbucket-pipelines.yml
# (its branch triggers never matched real branches and its `test` step ran nothing).
on:
  pull_request:
  push:
    branches:
      - main
      - customerSAX-Dev
      - customerSAX-QA
      - customerSAX-redesign-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # TODO(ci): add `pnpm lint` once apps/docs-site has an ESLint config
      # (its `next lint` currently prompts interactively and fails), and
      # `pnpm build` once a secret-free build config is in place.
