image: node:20

definitions:
  caches:
    pnpm: .pnpm-store
  steps:
    - step: &install
        name: pnpm install
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare pnpm@9.6.0 --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
    - step: &test
        name: pnpm test
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare pnpm@9.6.0 --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm test
    - step: &typecheck
        name: pnpm typecheck
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare pnpm@9.6.0 --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm typecheck
    - step: &lint
        name: pnpm lint
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare pnpm@9.6.0 --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm lint
    - step: &build
        name: pnpm build
        caches:
          - pnpm
        script:
          - corepack enable
          - corepack prepare pnpm@9.6.0 --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm build

pipelines:
  pull-requests:
    "**":
      - step: *install
      - parallel:
          - step: *test
          - step: *typecheck
          - step: *lint
          - step: *build
  branches:
    main:
      - step: *install
      - parallel:
          - step: *test
          - step: *typecheck
          - step: *lint
          - step: *build
    develop:
      - step: *install
      - parallel:
          - step: *test
          - step: *typecheck
          - step: *lint
          - step: *build
